# 按 2 核 4 GB 服务器限制资源。所有环境参数统一由本地 .env 注入，不写入 Git 跟踪文件。
services:
  backend:
    image: driftingleaves-v2-backend:local
    build:
      context: .
      dockerfile: DockerFile
    container_name: driftingleaves-backend
    restart: unless-stopped
    networks:
      - driftingleaves
    ports:
      - "127.0.0.1:5922:5922"
    environment:
      SPRING_PROFILES_ACTIVE: prd
      SERVER_PORT: "5922"
      SERVER_FORWARD_HEADERS_STRATEGY: none
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      DB_URL: "${DB_URL:-}"
      DB_USERNAME: "${DB_USERNAME:-}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      REDIS_HOST: "${REDIS_HOST:-}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DATABASE: "${REDIS_DATABASE:-0}"
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-dl:v2:}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MAIL_ENABLED: "${MAIL_ENABLED:-true}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-DriftingLeaves}"
      MAIL_CONFIRM_URL: "${MAIL_CONFIRM_URL:-}"
      MAIL_UNSUBSCRIBE_URL: "${MAIL_UNSUBSCRIBE_URL:-}"
      HOME_BASE_URL: "${HOME_BASE_URL:-}"
      BLOG_BASE_URL: "${BLOG_BASE_URL:-}"
      ADMIN_BASE_URL: "${ADMIN_BASE_URL:-}"
      CV_BASE_URL: "${CV_BASE_URL:-}"
      PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-}"
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS:-}"
      FILE_PUBLIC_ORIGINS: "${FILE_PUBLIC_ORIGINS:-}"
      OSS_ENABLED: "${OSS_ENABLED:-true}"
      OSS_ENDPOINT: "${OSS_ENDPOINT:-}"
      OSS_REGION: "${OSS_REGION:-}"
      OSS_BUCKET: "${OSS_BUCKET:-}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:-}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:-}"
      OSS_SECURITY_TOKEN: "${OSS_SECURITY_TOKEN:-}"
      OSS_KEY_PREFIX: "${OSS_KEY_PREFIX:-}"
      OAUTH_GITHUB_ENABLED: "${OAUTH_GITHUB_ENABLED:-false}"
      OAUTH_GITHUB_CLIENT_ID: "${OAUTH_GITHUB_CLIENT_ID:-}"
      OAUTH_GITHUB_CLIENT_SECRET: "${OAUTH_GITHUB_CLIENT_SECRET:-}"
      OAUTH_GITHUB_REDIRECT_URI: "${OAUTH_GITHUB_REDIRECT_URI:-}"
      OAUTH_GITEE_ENABLED: "${OAUTH_GITEE_ENABLED:-false}"
      OAUTH_GITEE_CLIENT_ID: "${OAUTH_GITEE_CLIENT_ID:-}"
      OAUTH_GITEE_CLIENT_SECRET: "${OAUTH_GITEE_CLIENT_SECRET:-}"
      OAUTH_GITEE_REDIRECT_URI: "${OAUTH_GITEE_REDIRECT_URI:-}"
      OAUTH_QQ_ENABLED: "${OAUTH_QQ_ENABLED:-false}"
      OAUTH_QQ_CLIENT_ID: "${OAUTH_QQ_CLIENT_ID:-}"
      OAUTH_QQ_CLIENT_SECRET: "${OAUTH_QQ_CLIENT_SECRET:-}"
      OAUTH_QQ_REDIRECT_URI: "${OAUTH_QQ_REDIRECT_URI:-}"
      UPLOAD_ROOT: /app/uploads
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms512m -Xmx1024m
    volumes:
      - uploads:/app/uploads
      # 外部生产配置目录（Spring Boot 自动加载 /app/config/application-prd.yml），不纳入 Git。
      - ./config:/app/config:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5922/api/v1/home/profile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27.5-alpine
    container_name: driftingleaves-nginx
    restart: unless-stopped
    networks:
      - driftingleaves
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./html:/usr/share/nginx/html:ro
      - ./SSL:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q && wget --no-check-certificate -q -O /dev/null https://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads:

networks:
  driftingleaves:
    external: true
    name: driftingleaves
