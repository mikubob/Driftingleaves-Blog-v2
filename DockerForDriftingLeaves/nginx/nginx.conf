worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 只记录路径，避免 OAuth 回调参数进入访问日志。
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    client_max_body_size 50M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    # 在线握手使用独立票据；普通 HTTP 请求继续传递 Cookie。
    map $uri $backend_cookie {
        default $http_cookie;
        ~^/api/v1/(home|blog|cv)/ws/online$ '';
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $backend_cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    upstream backend {
        # 后端容器重建后，通过 Docker DNS 更新上游地址。
        zone backend 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        server backend:5922 resolve;
        keepalive 32;
    }

    # ---------------- Home Site ----------------
    server {
        listen 80;
        server_name driftingleaves.xyz www.driftingleaves.xyz;
        return 301 https://driftingleaves.xyz$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name driftingleaves.xyz;

        ssl_certificate /etc/nginx/ssl/SSL-Home/driftingleaves.xyz_bundle.pem;
        ssl_certificate_key /etc/nginx/ssl/SSL-Home/driftingleaves.xyz.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        root /usr/share/nginx/html/Home/dist;
        index index.html;

        location / {
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/api/v1/home/ {
            proxy_pass http://backend;
        }

        location ~ ^/api(?:/|$) {
            return 404;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        access_log /var/log/nginx/home.access.log main;
        error_log /var/log/nginx/home.error.log;
    }

    # 主页只使用一个公开 Origin，兼容旧的 www 访问入口。
    server {
        listen 443 ssl;
        http2 on;
        server_name www.driftingleaves.xyz;
        ssl_certificate /etc/nginx/ssl/SSL-Home/driftingleaves.xyz_bundle.pem;
        ssl_certificate_key /etc/nginx/ssl/SSL-Home/driftingleaves.xyz.key;
        return 301 https://driftingleaves.xyz$request_uri;
    }

    # ---------------- Admin Site ----------------
    server {
        listen 80;
        server_name admin.driftingleaves.xyz;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name admin.driftingleaves.xyz;

        ssl_certificate /etc/nginx/ssl/SSL-Admin/admin.driftingleaves.xyz_bundle.pem;
        ssl_certificate_key /etc/nginx/ssl/SSL-Admin/admin.driftingleaves.xyz.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        root /usr/share/nginx/html/Admin/dist;
        index index.html;

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/api/v1/admin/auth/oauth/[^/]+/callback/?$ {
            # 上游出错时，Nginx 错误日志也会带上原始查询参数。
            error_log /dev/null;
            proxy_pass http://backend;
        }

        location ~ ^/api/v1/admin/ {
            client_max_body_size 61M;
            proxy_pass http://backend;
        }

        location ~ ^/api(?:/|$) {
            return 404;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        access_log /var/log/nginx/admin.access.log main;
        error_log /var/log/nginx/admin.error.log;
    }

    # ---------------- Blog Site ----------------
    server {
        listen 80;
        server_name blog.driftingleaves.xyz;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name blog.driftingleaves.xyz;

        ssl_certificate /etc/nginx/ssl/SSL-Blog/blog.driftingleaves.xyz_bundle.pem;
        ssl_certificate_key /etc/nginx/ssl/SSL-Blog/blog.driftingleaves.xyz.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        root /usr/share/nginx/html/Blog/dist;
        index index.html;

        location / {
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/api/v1/blog/auth/oauth/[^/]+/callback/?$ {
            # 上游出错时，Nginx 错误日志也会带上原始查询参数。
            error_log /dev/null;
            proxy_pass http://backend;
        }

        location ~ ^/api/v1/blog/ {
            proxy_pass http://backend;
        }

        location ~ ^/api(?:/|$) {
            return 404;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        access_log /var/log/nginx/blog.access.log main;
        error_log /var/log/nginx/blog.error.log;
    }

    # ---------------- CV Site ----------------
    server {
        listen 80;
        server_name cv.driftingleaves.xyz;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name cv.driftingleaves.xyz;

        ssl_certificate /etc/nginx/ssl/SSL-Cv/cv.driftingleaves.xyz_bundle.pem;
        ssl_certificate_key /etc/nginx/ssl/SSL-Cv/cv.driftingleaves.xyz.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        root /usr/share/nginx/html/CV/dist;
        index index.html;

        location / {
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/api/v1/cv/ {
            proxy_pass http://backend;
        }

        location ~ ^/api(?:/|$) {
            return 404;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        access_log /var/log/nginx/cv.access.log main;
        error_log /var/log/nginx/cv.error.log;
    }

    # ---------------- BT Panel Site ----------------
    server {
        listen 80;
        server_name bt.driftingleaves.xyz;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name bt.driftingleaves.xyz;

        ssl_certificate /etc/nginx/ssl/SSL-Bt/bt.driftingleaves.xyz_bundle.pem;
        ssl_certificate_key /etc/nginx/ssl/SSL-Bt/bt.driftingleaves.xyz.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        location / {
            proxy_pass https://139.199.65.146:33137/;
            proxy_http_version 1.1;
            proxy_set_header Host 139.199.65.146:33137;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_ssl_verify off;
            proxy_ssl_server_name on;

            proxy_redirect ~^https?://[^/]+(/.+)$ $scheme://$host$1;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        access_log /var/log/nginx/bt.access.log main;
        error_log /var/log/nginx/bt.error.log;
    }
}
