<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Drifting Leaves 管理控制台" />
    <title>管理控制台 · Drifting Leaves</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10'/%3E%3Cpath d='M29 10C12 10 9 20 14 26s17 0 15-16ZM13 29l12-14' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"
    />
    <style>
      /* 首屏加载动画：脚本下载期间显示，#app 挂载内容后自动淡出。 */
      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f5f7fa;
        color: #303133;
        transition: opacity .45s ease, visibility 0s linear .45s;
      }

      #app:not(:empty) + .boot-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-loader-ring {
        width: 34px;
        height: 34px;
        border: 2px solid rgb(0 0 0 / 10%);
        border-top-color: currentColor;
        border-radius: 50%;
        corner-shape: round;
        animation: boot-spin .8s linear infinite;
      }

      .boot-loader-text {
        font: 500 11px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        letter-spacing: .35em;
        text-transform: uppercase;
        animation: boot-breathe 1.6s ease-in-out infinite alternate;
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes boot-breathe {
        from { opacity: .35; }
        to { opacity: .8; }
      }

      @media print {
        .boot-loader {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="boot-loader" aria-hidden="true">
      <span class="boot-loader-ring"></span>
      <span class="boot-loader-text">Drifting Leaves</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
