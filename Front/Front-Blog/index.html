<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="落叶随风，记录技术、生活与每一次思考。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DriftingLeaves · 博客</title>
    <script>
      try {
        var m = localStorage.getItem('dl-blog-theme')
        if (m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <style>
      /* 首屏加载动画：脚本下载期间显示，#app 挂载内容后自动淡出。 */
      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f5f7fa;
        color: #303133;
        transition: opacity .45s ease, visibility 0s linear .45s;
      }

      #app:not(:empty) + .boot-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #app:not(:empty) + .boot-loader * {
        animation: none;
      }

      .boot-loader-ring {
        width: 34px;
        height: 34px;
        border: 2px solid rgb(0 0 0 / 10%);
        border-top-color: currentColor;
        border-radius: 50%;
        corner-shape: round;
        animation: boot-spin .8s linear infinite;
      }

      .boot-loader-text {
        font: 500 11px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        letter-spacing: .35em;
        text-transform: uppercase;
        animation: boot-breathe 1.6s ease-in-out infinite alternate;
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes boot-breathe {
        from { opacity: .35; }
        to { opacity: .8; }
      }

      html.dark .boot-loader {
        background: #181818;
        color: #e5e5e5;
      }

      html.dark .boot-loader-ring {
        border-color: rgb(255 255 255 / 12%);
        border-top-color: currentColor;
      }

      @media print {
        .boot-loader {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="boot-loader" aria-hidden="true">
      <span class="boot-loader-ring"></span>
      <span class="boot-loader-text">Drifting Leaves</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
