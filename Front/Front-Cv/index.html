<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人在线简历，展示教育、工作、项目经历与专业技能。" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>在线简历 · Drifting Leaves</title>
    <style>
      /* 首屏加载动画：脚本下载期间显示，#app 挂载内容后自动淡出。 */
      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #fafafa;
        color: #1a1a1a;
        transition: opacity .45s ease, visibility 0s linear .45s;
      }

      #app:not(:empty) + .boot-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-loader-ring {
        width: 34px;
        height: 34px;
        border: 2px solid rgb(0 0 0 / 10%);
        border-top-color: currentColor;
        border-radius: 50%;
        corner-shape: round;
        animation: boot-spin .8s linear infinite;
      }

      .boot-loader-text {
        font: 500 11px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        letter-spacing: .35em;
        text-transform: uppercase;
        animation: boot-breathe 1.6s ease-in-out infinite alternate;
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes boot-breathe {
        from { opacity: .35; }
        to { opacity: .8; }
      }

      @media (prefers-color-scheme: dark) {
        .boot-loader {
          background: #111;
          color: #e8e8e8;
        }

        .boot-loader-ring {
          border-color: rgb(255 255 255 / 12%);
          border-top-color: currentColor;
        }
      }

      @media print {
        .boot-loader {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="boot-loader" aria-hidden="true">
      <span class="boot-loader-ring"></span>
      <span class="boot-loader-text">Drifting Leaves</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
